name: Build iOS

# Reusable (the release workflow calls it) *and* self-triggering on pull requests
# and master pushes.
#
# GitHub path filters are per-workflow, not per-job, which is the whole reason
# this is a separate file rather than a job inside one combined workflow: it is
# the only way to say "iOS work only rebuilds iOS". `lib/**`, `assets/**` and the
# pubspecs are shared with Android, so they appear in both this list and
# build-android.yaml's - a Dart change really does affect both platforms.
#
# No `tags:` trigger on purpose. A tag push runs the release workflow, which
# calls this one, so each platform is built exactly once per release.

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (a tag when called by the release workflow).
        type: string
        default: ''
  pull_request:
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'ios/**'
      - '.github/workflows/build-ios.yaml'
      - '.github/actions/flutter-setup/**'
  push:
    branches: [master]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'ios/**'
      - '.github/workflows/build-ios.yaml'
      - '.github/actions/flutter-setup/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ios-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Flutter
        uses: ./.github/actions/flutter-setup

      - name: Build iOS app (unsigned)
        run: flutter build ios --release --no-codesign

      # The IPA that AltStore is pointed at ships exactly as `--no-codesign`
      # leaves it: no signature anywhere in the bundle. AltStore re-signs with
      # the user's own certificate at install time, and it needs a clean bundle
      # to do that.
      #
      # Do not add an `ldid`/`codesign` step to this one. The old workflow ran
      # `find Runner.app -type f -exec ldid -S -M {} \;` over every file before
      # packaging, which injected 61 zero-byte `.ldid.*` files into the bundle -
      # including inside the frameworks' `_CodeSignature/` directories - and
      # rewrote each framework's CodeResources. AltStore could not seal the
      # result, and installd rejected the install with 0xe8008017 "a signed
      # resource has been added, modified, or deleted". The fakesigned build
      # below is the jailbroken case and is packaged separately for that reason.
      #
      # Only the outer filename is ours to choose. The zip's top-level directory
      # has to stay `Payload/` - AltStore and every other sideloading tool
      # expects that layout, and an IPA that unzips to anything else will not
      # install.
      #
      # The capital "OS" is deliberate, matching `xl-authenticator-android.apk`.
      # Release asset names are case-sensitive, so anything that builds this
      # string has to match byte for byte: the release workflow downloads,
      # unzips and stats this file, and writes it into altstore.json's
      # downloadURL. Keep the three in step.
      - name: Package the IPA for AltStore (unsigned)
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -r -y xl-authenticator-iOS.ipa Payload
          rm -rf Payload

      # A copy of the same build with an ldid pseudo-signature on every file.
      # That signature means nothing to a stock device - it is what a jailbroken
      # install wants, and it is the one thing AltStore must not be given. The
      # copy is taken after the clean IPA is already zipped, so the junk ldid
      # leaves behind can never reach the AltStore artifact.
      - name: Fakesign a copy for jailbroken devices
        run: |
          set -euo pipefail
          brew install ldid
          rm -rf Payload
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          find Payload/Runner.app -type f -exec ldid -S -M {} \;
          zip -r -y xl-authenticator-iOS-fakesigned.ipa Payload

      - name: Upload IPAs
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          if-no-files-found: error
          path: |
            xl-authenticator-iOS.ipa
            xl-authenticator-iOS-fakesigned.ipa
